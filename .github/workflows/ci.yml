name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check cdc_relay tests bench scripts
          ruff format --check cdc_relay tests bench scripts
      - name: Test (unit + captured stream)
        run: pytest --cov=cdc_relay --cov-report=term-missing
      - name: Benchmark (informational)
        if: matrix.python-version == '3.12'
        run: python bench/bench_decode.py --repeat 500

  postgres:
    name: end to end on PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "17"]
    env:
      TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Service containers cannot pass server flags, and logical decoding needs wal_level.
      - name: Start PostgreSQL with wal_level=logical
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:${{ matrix.postgres }}-alpine -c wal_level=logical
          for i in $(seq 1 30); do docker exec pg pg_isready -U postgres && break; sleep 1; done
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Slot setup, streaming, restart and reconnect tests
        run: pytest -v -m postgres
      - name: Capture and decode a demo round with the CLI
        env:
          CDC_DSN: ${{ env.TEST_PG_DSN }}
        run: |
          cdc-relay slot create
          cdc-relay demo
          cdc-relay capture --out capture.jsonl
          cdc-relay decode capture.jsonl | tee decoded.jsonl | head -5
          python - <<'PY'
          import json
          kinds = [json.loads(line)["type"] for line in open("decoded.jsonl")]
          assert kinds.count("Commit") >= 10 and "Truncate" in kinds, kinds
          PY
          cdc-relay -c examples/relay.yaml replay capture.jsonl --sink file --out records.jsonl
          test "$(grep -c swift.events.parcel records.jsonl)" -eq 6

  docker:
    name: docker compose smoke test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Start Postgres, Redis, relay and demo writer
        run: docker compose up -d --build
      - name: Wait for outbox events in Redis Streams
        run: |
          for i in $(seq 1 60); do
            curl -fsS localhost:8086/healthz >/dev/null 2>&1 && \
              n=$(docker compose exec -T redis redis-cli XLEN swift.events.parcel) && \
              [ "${n:-0}" -ge 6 ] && break
            sleep 2
          done
          curl -fsS localhost:8086/status
          docker compose exec -T redis redis-cli XRANGE swift.events.parcel - + COUNT 2
          test "$(docker compose exec -T redis redis-cli XLEN swift.events.parcel)" -ge 6
      - name: Restart the relay and check it resumes from its checkpoint
        run: |
          docker compose restart relay
          sleep 10
          docker compose logs relay | grep -E "streaming slot cdc_relay from 0/[1-9A-F]"
      - name: Logs
        if: always()
        run: docker compose logs --tail 50 relay
      - run: docker compose down -v
        if: always()
